<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Login - JMC</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='jakkar_logo.png') }}">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card card-custom p-4 shadow-lg border-0">
                <div class="text-center mb-4">
                    <img src="{{ url_for('static', filename='jakkar_logo.png') }}" alt="JMC Logo" style="height: 80px; object-fit: contain; margin-bottom: 15px;">
                    <h4 class="fw-bold text-dark mb-0">HR Portal Access</h4>
                    <p class="text-muted small">Please sign in to continue</p>
                </div>

                <!-- Error Message Alert -->
                {% if error %}
                <div class="alert alert-danger d-flex align-items-center py-2" role="alert">
                    <i class="fa-solid fa-triangle-exclamation me-2"></i>
                    <div class="small fw-bold">{{ error }}</div>
                </div>
                {% endif %}

                <form action="/login" method="POST">
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-bold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-user text-muted"></i></span>
                            <input type="text" name="username" class="form-control border-start-0 ps-0" placeholder="Enter username" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                            <input type="password" name="password" class="form-control border-start-0 ps-0" placeholder="Enter password" required>
                        </div>
                    </div>

                    <button class="btn btn-jmc-red w-100 py-2 fw-bold mb-2" type="submit">
                        Secure Login <i class="fa-solid fa-arrow-right-to-bracket ms-1"></i>
                    </button>
                </form>
                
                <div class="text-center mt-3">
                    <span class="small text-muted"><i class="fa-solid fa-shield-halved text-success"></i> Secured System</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
