<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - JMC</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='jakkar_logo.png') }}">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container my-4 my-md-5">
    <div class="row justify-content-center">
        <div class="col-xl-6 col-lg-8">
            <div class="card card-custom p-3 p-md-4">
                <div class="d-flex align-items-center gap-2 mb-3">
                    <img src="{{ url_for('static', filename='jakkar_logo.png') }}" style="height: 35px; object-fit: contain;">
                    <h3 class="fw-bold text-dark mb-0 fs-4 fs-md-3">Update Profile</h3>
                </div>
                <p class="text-muted small">Modifying employee record for: <span class="fw-bold text-jmc-red">{{ emp.name }}</span></p>
                <hr class="mt-0 mb-4">
                
                <form action="/edit/{{ emp.id }}" method="POST" enctype="multipart/form-data">
                    <input type="hidden" name="existing_photo" value="{{ emp.photo }}">

                    <div class="text-center mb-4">
                        <label for="photo-upload" style="cursor: pointer;" title="Click to change photo" class="photo-preview-container">
                            <img id="photo-preview"
                                src="{% if emp.photo %}{{ url_for('static', filename='uploads/' + emp.photo) }}{% else %}https://via.placeholder.com/150x150/efefef/999999?text=Upload+Photo{% endif %}" 
                                alt="Employee Photo" 
                                style="width: 140px; height: 140px; min-width: 140px; min-height: 140px; aspect-ratio: 1/1; border-radius: 50%; object-fit: cover; display: inline-block;">
                        </label>
                        <input type="file" id="photo-upload" name="photo" class="d-none" accept="image/*" onchange="document.getElementById('photo-preview').src = window.URL.createObjectURL(this.files[0])">
                        <div class="small text-muted mt-2 fw-bold"><i class="fa-solid fa-camera me-1"></i>Click circle to change photo</div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label text-muted small mb-1 fw-bold">Full Name</label>
                        <input type="text" name="name" class="form-control" value="{{ emp.name }}" maxlength="20" oninput="this.value = this.value.toUpperCase()" required>
                    </div>

                    <div class="row">
                        <div class="col-12 col-md-6 mb-3">
                            <label class="form-label text-muted small mb-1 fw-bold">ID Number</label>
                            <input type="text" name="id_no" class="form-control" value="{{ emp.id_no }}" maxlength="7" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required>
                        </div>
                        <div class="col-12 col-md-6 mb-3">
                            <label class="form-label text-muted small mb-1 fw-bold">Position</label>
                            <input type="text" name="position" class="form-control" value="{{ emp.position }}" maxlength="20" oninput="this.value = this.value.toUpperCase()" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-12 col-md-6 mb-3">
                            <label class="form-label text-muted small mb-1 fw-bold">Department</label>
                            <input type="text" name="department" class="form-control" value="{{ emp.department }}" maxlength="20" oninput="this.value = this.value.toUpperCase()" required>
                        </div>
                        <div class="col-12 col-md-6 mb-3">
                            <label class="form-label text-muted small mb-1 fw-bold">Date Hired</label>
                            <input type="date" name="date_hired" class="form-control" value="{{ emp.date_hired }}" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-12 col-md-6 mb-3">
                            <label class="form-label text-muted small mb-1 fw-bold">Birthdate</label>
                            <input type="date" name="birthdate" class="form-control" value="{{ emp.birthdate }}" required>
                        </div>
                        <div class="col-12 col-md-6 mb-3">
                            <label class="form-label text-muted small mb-1 fw-bold">Address</label>
                            <input type="text" name="address" class="form-control" value="{{ emp.address }}" oninput="this.value = this.value.toUpperCase()" required>
                        </div>
                    </div>

                    <div class="card p-3 bg-light border-0 mb-3">
                        <h6 class="fw-bold text-dark mb-3"><i class="fa-solid fa-address-card me-1"></i>Government Identifiers</h6>
                        <div class="row">
                            <div class="col-12 col-sm-6 mb-2">
                                <label class="form-label text-muted small mb-1">SSS No.</label>
                                <input type="text" name="sss" class="form-control form-control-sm" value="{{ emp.sss }}" maxlength="12" oninput="let sss = this.value.replace(/\D/g, '').substring(0, 10); this.value = sss.slice(0,2) + (sss.length > 2 ? '-' + sss.slice(2,9) : '') + (sss.length > 9 ? '-' + sss.slice(9,10) : '');" required>
                            </div>
                            <div class="col-12 col-sm-6 mb-2">
                                <label class="form-label text-muted small mb-1">Philhealth No.</label>
                                <input type="text" name="philhealth" class="form-control form-control-sm" value="{{ emp.philhealth }}" maxlength="14" oninput="let ph = this.value.replace(/\D/g, '').substring(0, 12); this.value = ph.slice(0,2) + (ph.length > 2 ? '-' + ph.slice(2,11) : '') + (ph.length > 11 ? '-' + ph.slice(11,12) : '');" required>
                            </div>
                            <div class="col-12 col-sm-6 mb-2">
                                <label class="form-label text-muted small mb-1">HDMF No.</label>
                                <input type="text" name="hdmf" class="form-control form-control-sm" value="{{ emp.hdmf }}" maxlength="14" oninput="let hdmf = this.value.replace(/\D/g, '').substring(0, 12); this.value = hdmf.slice(0,4) + (hdmf.length > 4 ? '-' + hdmf.slice(4,8) : '') + (hdmf.length > 8 ? '-' + hdmf.slice(8,12) : '');" required>
                            </div>
                            <div class="col-12 col-sm-6 mb-2">
                                <label class="form-label text-muted small mb-1">TIN No.</label>
                                <input type="text" name="tin" class="form-control form-control-sm" value="{{ emp.tin }}" maxlength="15" oninput="let tin = this.value.replace(/\D/g, '').substring(0, 12); this.value = tin.slice(0,3) + (tin.length > 3 ? '-' + tin.slice(3,6) : '') + (tin.length > 6 ? '-' + tin.slice(6,9) : '') + (tin.length > 9 ? '-' + tin.slice(9,12) : '');" required>
                            </div>
                        </div>
                    </div>

                    <div class="card p-3 bg-light border-0 mb-4">
                        <h6 class="fw-bold text-dark mb-3"><i class="fa-solid fa-phone-flip me-1"></i>In Case of Emergency</h6>
                        <div class="mb-2">
                            <label class="form-label text-muted small mb-1">Contact Person</label>
                            <input type="text" name="em_name" class="form-control form-control-sm" value="{{ emp.em_name }}" maxlength="20" oninput="this.value = this.value.toUpperCase()" required>
                        </div>
                        <div>
                            <label class="form-label text-muted small mb-1">Contact Number</label>
                            <input type="text" name="em_contact" class="form-control form-control-sm" value="{{ emp.em_contact }}" maxlength="11" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required>
                        </div>
                    </div>

                    <div class="row g-2">
                        <div class="col-12 col-sm-6 mb-2 mb-sm-0">
                            <a href="/" class="btn btn-secondary w-100 py-2 fw-bold"><i class="fa-solid fa-circle-xmark"></i> Cancel</a>
                        </div>
                        <div class="col-12 col-sm-6">
                            <button class="btn btn-jmc-red w-100 py-2 fw-bold" type="submit"><i class="fa-solid fa-floppy-disk"></i> Update Profile</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
